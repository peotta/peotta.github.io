<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Simul-Net: simuladores de redes e protocolos, em andamento</title>
<desc id="d">Animação do projeto Simul-Net: um diagrama de sequência do handshake TCP (SYN, SYN-ACK, ACK) ao lado de uma topologia com a troca DHCP (DISCOVER, OFFER, REQUEST, ACK), e a lista dos simuladores: roteamento, DHCP, ICMP, BGP, MPLS, TCP e UDP, SSH, HTTPS e FTP.</desc>
<style>@keyframes p1{0%,5.800%{opacity:0;transform:translate(0,0)}6.000%{opacity:1;transform:translate(0,0)}17.000%{opacity:1;transform:translate(380px,30px)}18.600%,100%{opacity:0;transform:translate(380px,30px)}}
.p1{animation:p1 12s linear infinite}
@keyframes d1{0%,17.200%{opacity:0}17.500%,92.000%{opacity:1}95.000%,100%{opacity:0}}
.d1{animation:d1 12s linear infinite}
