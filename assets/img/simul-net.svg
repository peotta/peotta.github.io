@keyframes q4a{0%,59.800%{opacity:0;transform:translate(0,0)}60.000%{opacity:1;transform:translate(0,0)}68.000%{opacity:1;transform:translate(-109px,50px)}69.600%,100%{opacity:0;transform:translate(-109px,50px)}}
