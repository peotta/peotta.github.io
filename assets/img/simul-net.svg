.q1a{animation:q1a 12s linear infinite}
@keyframes q1b{0%,13.800%{opacity:0;transform:translate(0,0)}14.000%{opacity:1;transform:translate(0,0)}22.000%{opacity:1;transform:translate(109px,-50px)}23.600%,100%{opacity:0;transform:translate(109px,-50px)}}
