@keyframes bound{0%,77.700%{opacity:0}78.000%,92.000%{opacity:1}95.000%,100%{opacity:0}}
.bound{animation:bound 12s linear infinite}
@keyframes tw{0%{transform:scaleX(0)}8.333%,100%{transform:scaleX(1)}}
.twr{transform-box:fill-box;transform-origin:left center;animation:tw 12s steps(22,end) infinite}
.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.gridmove{animation:gm 6s linear infinite}@keyframes gm{from{transform:translateY(0)}to{transform:translateY(40px)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out infinite}.halo.b{animation-delay:1.5s}@keyframes halo{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.35);opacity:0}}
.glow{animation:glowp 3s ease-in-out infinite}@keyframes glowp{0%,100%{filter:drop-shadow(0 0 3px rgba(72,255,139,.35))}50%{filter:drop-shadow(0 0 12px rgba(72,255,139,.95))}}
.dot{animation:dotp 1.8s ease-in-out infinite}@keyframes dotp{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes chip{0%,10.4%{stroke-opacity:1;fill-opacity:.35}12.5%,100%{stroke-opacity:.35;fill-opacity:0}}
.chip{animation:chip 12s linear infinite}
@keyframes chipt{0%,10.4%{fill:#effff4}12.5%,100%{fill:#91caa4}}
.chipt{animation:chipt 12s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}.twr{transform:none}.p1,.p2,.p3,.q1a,.q1b,.q2a,.q2b,.q3a,.q3b,.q4a,.q4b{opacity:0}.d1,.d2,.d3,.est,.bound{opacity:1}}</style>
