<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">CryptoNet Lab: laboratório virtual de criptografia, em andamento</title>
<desc id="d">Animação do projeto CryptoNet Lab: Alice e Bob trocam valores públicos de Diffie-Hellman enquanto um observador vê só valores públicos, sem conseguir o segredo compartilhado, depois o efeito avalanche de uma função hash.</desc>
<style>
.a{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:linear}
.s{transform-box:fill-box;transform-origin:center}
.gridmove{animation:gm 6s linear infinite}
@keyframes gm{from{transform:translateY(0)}to{transform:translateY(40px)}}
.twr{transform-box:fill-box;transform-origin:left center;animation:tw 12s steps(20,end) infinite}
@keyframes tw{0%{transform:scaleX(0)}8.333%,100%{transform:scaleX(1)}}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.title{animation:tin 12s linear infinite}
@keyframes tin{0%{opacity:0;transform:translateY(10px)}5.833%,94.167%{opacity:1;transform:translateY(0)}98.333%,100%{opacity:0;transform:translateY(0)}}
.sub{animation:r1 12s linear infinite}
.lab{animation:glowp 3s ease-in-out infinite}
@keyframes glowp{0%,100%{filter:drop-shadow(0 0 3px rgba(72,255,139,.35))}50%{filter:drop-shadow(0 0 14px rgba(72,255,139,.95))}}
.dot{animation:dotp 1.8s ease-in-out infinite}
@keyframes dotp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.d1,.d2,.d3{animation:dots 1.5s steps(1) infinite}
.d2{animation-delay:.5s}.d3{animation-delay:1s}
@keyframes dots{0%{opacity:.25}33%{opacity:1}66%{opacity:.25}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out infinite}
.halo.b{animation-delay:1.5s}
@keyframes halo{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.35);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.ring.r2{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.pupil{animation:scan 3.2s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
.pk{animation-name:pk}
.pkA{animation:pka 12s linear infinite}
.pkB{animation:pkb 12s linear infinite}
@keyframes pka{0%,24.167%{opacity:0;transform:translateX(0)}25.0%{opacity:1;transform:translateX(0)}45.0%{opacity:1;transform:translateX(410px)}47.5%,100%{opacity:0;transform:translateX(410px)}}
@keyframes pkb{0%,24.167%{opacity:0;transform:translateX(0)}25.0%{opacity:1;transform:translateX(0)}45.0%{opacity:1;transform:translateX(-410px)}47.5%,100%{opacity:0;transform:translateX(-410px)}}
.beam{animation:beam 12s linear infinite}
@keyframes beam{0%,28.333%{opacity:.15}35.0%{opacity:1}41.667%{opacity:.15}44.167%{opacity:0.15}100%{opacity:.15}}
.evtxt{animation:r2 12s linear infinite}
.key{animation:r3 12s linear infinite}
.kglow{animation:kg 2.2s ease-in-out infinite}
@keyframes kg{0%,100%{filter:drop-shadow(0 0 2px rgba(72,255,139,.3))}50%{filter:drop-shadow(0 0 12px rgba(72,255,139,.9))}}
.draw{stroke-dasharray:300;animation:draw 12s linear infinite}
@keyframes draw{0%,44.167%{stroke-dashoffset:300;opacity:0}45.833%{opacity:1}54.167%,91.667%{stroke-dashoffset:0;opacity:1}96.667%,100%{stroke-dashoffset:0;opacity:0}}
.dl{animation:r4 12s linear infinite}
.hash1{animation:r5 12s linear infinite}
.hash2{animation:r6 12s linear infinite}
.h2c{animation:wave 12s linear infinite}
@keyframes wave{0%,68.333%{fill:#d8ffe7}69.583%{fill:#ffffff}74.167%,100%{fill:#ffb84d}}
.nflip{animation:nf 12s linear infinite}
@keyframes nf{0%,65.833%{fill:#d8ffe7}67.083%,100%{fill:#ffb84d}}
.cap{animation:r7 12s linear infinite}
.p1{animation:p1 12s linear infinite}.p2{animation:p2 12s linear infinite}.p3{animation:p3 12s linear infinite}
.pend{stroke-dasharray:4 5;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.pendt{animation:pendt 2.4s ease-in-out infinite}
@keyframes pendt{0%,100%{opacity:.55}50%{opacity:1}}
.pend2 .pendt{animation-delay:.4s}.pend3 .pendt{animation-delay:.8s}
.foot{animation:r8 12s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes r1{0%,7.5%{opacity:0}11.25%,94.167%{opacity:1}98.333%,100%{opacity:0}}@keyframes r2{0%,28.333%{opacity:0}32.083%,94.167%{opacity:1}98.333%,100%{opacity:0}}@keyframes r3{0%,48.333%{opacity:0}52.083%,94.167%{opacity:1}98.333%,100%{opacity:0}}@keyframes r4{0%,51.667%{opacity:0}55.417%,94.167%{opacity:1}98.333%,100%{opacity:0}}@keyframes r5{0%,61.667%{opacity:0}65.417%,94.167%{opacity:1}98.333%,100%{opacity:0}}@keyframes r6{0%,66.667%{opacity:0}70.417%,94.167%{opacity:1}98.333%,100%{opacity:0}}@keyframes r7{0%,61.667%{opacity:0}65.417%,94.167%{opacity:1}98.333%,100%{opacity:0}}@keyframes r8{0%,8.333%{opacity:0}12.083%,94.167%{opacity:1}98.333%,100%{opacity:0}}.gen{animation:gen 12s linear infinite}@keyframes gen{0%,10.833%{filter:none}13.333%,21.667%{filter:drop-shadow(0 0 10px #ff5d5d)}25.0%,100%{filter:none}}@keyframes p1{0%,80.0%{opacity:0;transform:scale(.55)}82.917%{opacity:1;transform:scale(1.08)}84.583%,94.167%{opacity:1;transform:scale(1)}98.333%,100%{opacity:0;transform:scale(1)}}@keyframes p2{0%,82.5%{opacity:0;transform:scale(.55)}85.417%{opacity:1;transform:scale(1.08)}87.083%,94.167%{opacity:1;transform:scale(1)}98.333%,100%{opacity:0;transform:scale(1)}}@keyframes p3{0%,85.0%{opacity:0;transform:scale(.55)}87.917%{opacity:1;transform:scale(1.08)}89.583%,94.167%{opacity:1;transform:scale(1)}98.333%,100%{opacity:0;transform:scale(1)}}</style>
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#06301a"/><stop offset="0.55" stop-color="#031008"/><stop offset="1" stop-color="#010301"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#48ff8b" stroke-opacity="0.08" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowR" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="twc"><rect class="twr" x="36" y="16" width="330" height="36"/></clipPath>
</defs>
<rect width="1200" height="520" fill="url(#bg)"/>
<rect class="gridmove" x="0" y="-40" width="1200" height="600" fill="url(#grid)"/>

<g clip-path="url(#twc)"><text x="40" y="44" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="22" letter-spacing="4" fill="#48ff8b">$ ./cryptonet --lab</text></g>
<rect class="cursor" x="372" y="25" width="13" height="24" fill="#48ff8b"/>
<text class="foot" x="1160" y="44" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="16" fill="#91caa4" opacity="0.85">uso didático · UnB</text>

<path d="M262 230H938" stroke="#48ff8b" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 9"/>

<!-- Alice -->
<circle class="halo" cx="180" cy="230" r="64" fill="none" stroke="#48ff8b" stroke-width="2"/>
<g filter="url(#glow)"><circle cx="180" cy="230" r="64" fill="#04160b" stroke="#48ff8b" stroke-width="3"/></g>
<text x="180" y="252" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="62" font-weight="800" fill="#effff4">A</text>
<text x="180" y="332" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="28" fill="#d8ffe7">Alice</text>
<g transform="translate(100,350)"><g class="gen"><rect width="160" height="38" rx="19" fill="#2a0a0a" stroke="#ff5d5d"/><text x="80" y="26" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="20" fill="#ff8a8a">a  (privada)</text></g></g>

<!-- Bob -->
<circle class="halo b" cx="1020" cy="230" r="64" fill="none" stroke="#48ff8b" stroke-width="2"/>
<g filter="url(#glow)"><circle cx="1020" cy="230" r="64" fill="#04160b" stroke="#48ff8b" stroke-width="3"/></g>
<text x="1020" y="252" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="62" font-weight="800" fill="#effff4">B</text>
<text x="1020" y="332" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="28" fill="#d8ffe7">Bob</text>
<g transform="translate(940,350)"><g class="gen"><rect width="160" height="38" rx="19" fill="#2a0a0a" stroke="#ff5d5d"/><text x="80" y="26" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="20" fill="#ff8a8a">b  (privada)</text></g></g>

<!-- Pacotes públicos em trânsito -->
<g transform="translate(270,172)"><g class="pkA"><rect width="260" height="52" rx="12" fill="#04160b" stroke="#48ff8b" stroke-width="2.5"/><text x="130" y="36" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="25" font-weight="700" fill="#48ff8b">A = g^a mod p</text></g></g>
<g transform="translate(670,240)"><g class="pkB"><rect width="260" height="52" rx="12" fill="#04160b" stroke="#00d26a" stroke-width="2.5"/><text x="130" y="36" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="25" font-weight="700" fill="#00d26a">B = g^b mod p</text></g></g>

<!-- Observador -->
<circle class="ring" cx="600" cy="112" r="40" fill="none" stroke="#ff5d5d" stroke-width="2"/>
<circle class="ring r2" cx="600" cy="112" r="40" fill="none" stroke="#ff5d5d" stroke-width="2"/>
<g filter="url(#glowR)"><circle cx="600" cy="112" r="40" fill="#1c0707" stroke="#ff5d5d" stroke-width="3"/></g>
<g transform="translate(600,112)" fill="none" stroke="#ff8a8a" stroke-width="3"><path d="M-20 0C-12 -12 12 -12 20 0C12 12 -12 12 -20 0Z"/><circle class="pupil" r="6" fill="#ff8a8a"/></g>
<path class="beam" d="M574 144L535 176M628 144L690 244" stroke="#ff5d5d" stroke-width="2.5" stroke-dasharray="5 5" fill="none"/>
<g class="evtxt"><text x="700" y="104" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="21" fill="#ff8a8a">Observador: vê só valores públicos</text></g>

<!-- Cálculo do segredo -->
<path class="draw" d="M232 284C300 335 340 365 400 380" stroke="#48ff8b" stroke-width="2.5" fill="none"/>
<path class="draw" d="M968 284C900 335 860 365 800 380" stroke="#00d26a" stroke-width="2.5" fill="none"/>
<g class="dl" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="19" fill="#91caa4"><text x="320" y="326">a + B</text><text x="840" y="326">b + A</text></g>
<g class="key" transform="translate(400,340)">
  <g class="kglow"><rect width="400" height="76" rx="16" fill="#04160b" stroke="#48ff8b" stroke-width="2"/></g>
  <g transform="translate(40,38)" fill="none" stroke="#48ff8b" stroke-width="3" stroke-linecap="round"><circle cx="-8" cy="0" r="9"/><path d="M1 0H22M16 0V8M22 0V6"/></g>
  <text x="238" y="34" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="23" font-weight="700" fill="#effff4">K = (g^a)^b = (g^b)^a</text>
  <text x="238" y="58" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="17" fill="#91caa4">segredo igual, nunca trafega</text>
</g>

<!-- Efeito avalanche -->
<g transform="translate(40,440)">
  <text class="cap" x="0" y="0" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="19" fill="#91caa4">SHA-256: trocar 1 letra muda 31 de 32 caracteres</text>
  <text class="hash1" x="0" y="32" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="22" fill="#d8ffe7">"Crypto<tspan class="nflip">N</tspan>et"  <tspan class="h1c">1</tspan><tspan class="h1c">2</tspan><tspan class="h1c">2</tspan><tspan class="h1c">2</tspan><tspan class="h1c">b</tspan><tspan class="h1c">9</tspan><tspan class="h1c">5</tspan><tspan class="h1c">9</tspan><tspan class="h1c">e</tspan><tspan class="h1c">b</tspan><tspan class="h1c">8</tspan><tspan class="h1c">1</tspan><tspan class="h1c">0</tspan><tspan class="h1c">f</tspan><tspan class="h1c">0</tspan><tspan class="h1c">3</tspan><tspan class="h1c">e</tspan><tspan class="h1c">0</tspan><tspan class="h1c">7</tspan><tspan class="h1c">e</tspan><tspan class="h1c">1</tspan><tspan class="h1c">d</tspan><tspan class="h1c">f</tspan><tspan class="h1c">8</tspan><tspan class="h1c">4</tspan><tspan class="h1c">6</tspan><tspan class="h1c">2</tspan><tspan class="h1c">2</tspan><tspan class="h1c">4</tspan><tspan class="h1c">5</tspan><tspan class="h1c">e</tspan><tspan class="h1c">4</tspan>…</text>
  <text class="hash2" x="0" y="62" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="22" fill="#d8ffe7">"Crypto<tspan class="nflip">n</tspan>et"  <tspan class="h2c" style="animation-delay:0.00s">5</tspan><tspan class="h2c" style="animation-delay:0.04s">0</tspan><tspan class="h2c" style="animation-delay:0.07s">e</tspan><tspan class="h2c" style="animation-delay:0.11s">0</tspan><tspan class="h2c" style="animation-delay:0.14s">6</tspan><tspan class="h2c" style="animation-delay:0.18s">e</tspan><tspan class="h2c" style="animation-delay:0.21s">5</tspan><tspan class="h2c" style="animation-delay:0.25s">4</tspan><tspan class="h2c" style="animation-delay:0.28s">8</tspan><tspan class="h2c" style="animation-delay:0.32s">f</tspan><tspan class="h2c" style="animation-delay:0.35s">5</tspan><tspan class="h2c" style="animation-delay:0.39s">b</tspan><tspan class="h2c" style="animation-delay:0.42s">4</tspan><tspan class="h2c" style="animation-delay:0.46s">4</tspan><tspan class="h2c" style="animation-delay:0.49s">6</tspan><tspan class="h2c" style="animation-delay:0.53s">6</tspan><tspan class="h2c" style="animation-delay:0.56s">6</tspan><tspan class="h2c" style="animation-delay:0.60s">f</tspan><tspan class="h2c" style="animation-delay:0.63s">e</tspan><tspan class="h2c" style="animation-delay:0.67s">3</tspan><tspan class="h2c" style="animation-delay:0.70s">c</tspan><tspan class="h2c" style="animation-delay:0.74s">4</tspan><tspan class="h2c" style="animation-delay:0.77s">2</tspan><tspan class="h2c" style="animation-delay:0.81s">4</tspan><tspan class="h2c" style="animation-delay:0.84s">f</tspan><tspan class="h2c" style="animation-delay:0.88s">a</tspan><tspan class="h2c" style="animation-delay:0.91s">1</tspan><tspan class="h2c" style="animation-delay:0.95s">b</tspan><tspan class="h2c" style="animation-delay:0.98s">a</tspan><tspan class="h2c" style="animation-delay:1.02s">b</tspan><tspan class="h2c" style="animation-delay:1.05s">4</tspan><tspan class="h2c" style="animation-delay:1.09s">8</tspan>…</text>
</g>

<!-- Legenda -->
<g class="foot" font-family="'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Consolas,monospace" font-size="19" fill="#d8ffe7" transform="translate(790,440)">
  <circle cx="8" cy="-6" r="7" fill="#48ff8b"/><text x="26" y="0">valor público (trafega)</text>
  <circle cx="8" cy="24" r="7" fill="#ff5d5d"/><text x="26" y="30">chave privada (nunca sai)</text>
