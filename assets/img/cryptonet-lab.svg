<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">CryptoNet Lab: laboratório virtual de criptografia, em andamento</title>
<desc id="d">Ilustração do projeto CryptoNet Lab: Alice e Bob trocam valores públicos de Diffie-Hellman enquanto Eve observa sem conseguir o segredo compartilhado, com o efeito avalanche de uma função hash e a lista de laboratórios prontos e em preparação.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="48%" r="70%"><stop offset="0" stop-color="#06301a"/><stop offset="0.55" stop-color="#031008"/><stop offset="1" stop-color="#010301"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#48ff8b" stroke-opacity="0.07" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowR" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="675" fill="url(#grid)"/>
<rect x="14" y="14" width="1172" height="647" rx="26" fill="none" stroke="#48ff8b" stroke-opacity="0.28"/>

