<text x="60" y="146" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="58" font-weight="800" fill="#effff4">CryptoNet <tspan fill="#48ff8b">Lab</tspan></text>
<text x="60" y="184" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="22" fill="#91caa4">Criptografia animada passo a passo, no navegador</text>

